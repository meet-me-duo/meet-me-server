services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: meetme
      POSTGRES_USER: meetme
      POSTGRES_PASSWORD: meetme
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetme -d meetme"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - meetme-postgres-data:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  meetme-postgres-data:
