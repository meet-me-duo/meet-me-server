spring:
  application:
    name: meet-me-server
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/meetme}
    username: ${DATABASE_USERNAME:meetme}
    password: ${DATABASE_PASSWORD:meetme}
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2s}
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  structured:
    format:
      console: logstash

meetme:
  anonymous:
    allowed-origins: ${APP_ALLOWED_ORIGINS:https://app.meet-me.co.kr}
    cookie-secure: ${ANONYMOUS_COOKIE_SECURE:true}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-3.8-flash
    max-response-bytes: 262144
  precheck:
    provider:
      enabled: ${MEETME_PRECHECK_PROVIDER_ENABLED:false}
  typesafe:
    api-key: ${TYPESAFE_API_KEY:}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-6-luna
    max-response-bytes: 262144
  reliability:
    enabled: ${RELIABILITY_ENABLED:true}
    consumer-name: ${REDIS_CONSUMER_NAME:meet-me-local}
    pending-min-idle: ${REDIS_PENDING_MIN_IDLE:2m}
    recovery-age: ${OUTBOX_RECOVERY_AGE:2m}
    dlq-retention: ${REDIS_DLQ_RETENTION:30d}
    dlq-max-entries: ${REDIS_DLQ_MAX_ENTRIES:10000}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    create-room:
      limit: ${RATE_LIMIT_CREATE_LIMIT:10}
      window: ${RATE_LIMIT_CREATE_WINDOW:1h}
      fail-closed: true
    join-room:
      limit: ${RATE_LIMIT_JOIN_LIMIT:30}
      window: ${RATE_LIMIT_JOIN_WINDOW:1h}
      fail-closed: false
    submission:
      limit: ${RATE_LIMIT_SUBMISSION_LIMIT:30}
      window: ${RATE_LIMIT_SUBMISSION_WINDOW:1m}
      fail-closed: false
    host-command:
      limit: ${RATE_LIMIT_HOST_COMMAND_LIMIT:5}
      window: ${RATE_LIMIT_HOST_COMMAND_WINDOW:1m}
      fail-closed: true
  data-retention:
    enabled: ${DATA_RETENTION_ENABLED:true}
    room-retention: ${ROOM_DATA_RETENTION:30d}
  ai-cost:
    usd-to-krw: ${AI_COST_USD_TO_KRW:1500}
    maximum-krw-per-meeting: ${AI_COST_MAXIMUM_KRW_PER_MEETING:10}
  auth:
    signing-key-id: ${AUTH_SIGNING_KEY_ID:}
    signing-private-key-path: ${AUTH_SIGNING_PRIVATE_KEY_PATH:}
    verification-jwks-path: ${AUTH_VERIFICATION_JWKS_PATH:}
    issuer: ${AUTH_ISSUER:https://api.meet-me.co.kr}
    audience: ${AUTH_AUDIENCE:meetme-web}
    web-callback-uri: ${AUTH_WEB_CALLBACK_URI:https://app.meet-me.co.kr/auth/callback}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:https://api.meet-me.co.kr/api/auth/google/callback}
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      redirect-uri: ${KAKAO_REDIRECT_URI:https://api.meet-me.co.kr/api/auth/kakao/callback}
