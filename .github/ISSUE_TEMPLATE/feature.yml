name: Feature request
description: 새로운 기능 또는 기능 개선 작업을 제안합니다.
title: "[Feature] "
body:
  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 해결하려는 문제와 기대 결과를 설명해주세요.
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: 요구사항
      description: 구현되어야 할 동작과 범위를 작성해주세요.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 완료 여부를 검증할 수 있는 기준을 작성해주세요.
    validations:
      required: true
  - type: textarea
    id: architecture
    attributes:
      label: 아키텍처 영향
      description: API, 도메인, 데이터베이스, 외부 연동 또는 배포 구조에 미치는 영향을 작성해주세요. 없으면 "없음"으로 표시해주세요.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 관련 PRD, Architecture, ADR 또는 외부 문서 링크를 추가해주세요.
