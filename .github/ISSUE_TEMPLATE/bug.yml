name: Bug report
description: 재현 가능한 백엔드 오류를 보고합니다.
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 문제
      description: 실제로 발생한 문제를 설명해주세요.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 문제를 재현할 수 있는 요청과 순서를 작성해주세요. 비밀정보와 개인정보는 포함하지 마세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 정상적으로 기대한 동작을 작성해주세요.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 증거
      description: 민감정보를 제거한 로그, 응답 또는 스크린샷을 추가해주세요.
  - type: input
    id: environment
    attributes:
      label: 환경
      description: 로컬, 개발 또는 운영 환경과 관련 버전을 작성해주세요.
    validations:
      required: true
