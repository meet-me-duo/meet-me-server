name: Infrastructure

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "infra/**"
      - ".github/workflows/infrastructure.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infrastructure-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.8

      - name: Check formatting
        run: terraform fmt -recursive -check infra

      - name: Validate bootstrap
        run: |
          terraform -chdir=infra/bootstrap init -backend=false -input=false
          terraform -chdir=infra/bootstrap validate

      - name: Validate production
        run: |
          terraform -chdir=infra/production init -backend=false -input=false
          terraform -chdir=infra/production validate

  plan:
    name: Production Plan
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.8

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Initialize production backend
        run: >-
          terraform -chdir=infra/production init -input=false
          -backend-config="bucket=${{ vars.TERRAFORM_STATE_BUCKET }}"

      - name: Create production plan
        run: terraform -chdir=infra/production plan -input=false -lock-timeout=5m -out=production.tfplan

      - name: Render human-readable plan
        run: terraform -chdir=infra/production show -no-color production.tfplan > production-plan.txt

      - name: Upload reviewed plan artifact
        uses: actions/upload-artifact@v6
        with:
          name: production-terraform-plan-${{ github.run_id }}
          path: infra/production/production-plan.txt
          if-no-files-found: error
          retention-days: 7

