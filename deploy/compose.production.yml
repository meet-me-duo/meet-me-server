services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    container_name: meet-me-app
    restart: unless-stopped
    env_file:
      - path: ${RUNTIME_ENV_FILE:-.env.runtime}
        format: raw
    environment:
      SPRING_PROFILES_ACTIVE: prod
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:9090/actuator/health"]
      interval: 15s
      timeout: 3s
      start_period: 45s
      retries: 4
    networks:
      - backend

  nginx:
    image: nginx:1.29-alpine
    container_name: meet-me-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/meet-me/tls:/etc/nginx/tls:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m
      - /var/run:size=8m
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
      - backend

networks:
  backend:
    driver: bridge

